experiment:
  name: multidomain_surface_pilot
  seed: 20260828
  output_root: experiments

data:
  train_manifest: data/multidomain/manifests_with_priors/train.csv
  val_manifest: data/multidomain/manifests_with_priors/validation.csv
  test_manifest: data/multidomain/manifests_with_priors/test.csv
  patch_size: 384
  validation_patch_size: 384
  train_samples_per_epoch: 1024
  balanced_landscape_sampling: true
  num_workers: 4
  rgb_scale: 255.0
  height_max_m: 200.0
  building_threshold_m: 2.0

model:
  # The protected baseline is nested as an urban expert; it is not overwritten.
  base_checkpoint: experiments/20260826T192229Z_highbuild_full_convnext_tiny/checkpoint_best_rmse.pt
  hidden_channels: 48
  maximum_building_residual_m: 30.0
  initial_canopy_height_m: 8.0
  initial_refinement_strength: 0.08

training:
  epochs: 16
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.001
  base_learning_rate_multiplier: 0.02
  # Stage one trains only the adapter; the protected urban expert never moves.
  freeze_base_epochs: 16
  weight_decay: 0.02
  max_gradient_norm: 1.0
  precision: bf16
  early_stopping_patience: 4
  huber_delta_m: 2.0
  semantic_weight: 1.0
  semantic_class_weights: [0.20, 1.0, 2.0]
  building_weight: 1.0
  canopy_weight: 2.0
  ground_suppression_weight: 0.25
  refinement_weight: 1.0
  uncertainty_weight: 0.01

evaluation:
  # Every landscape counts once; abundant plains cannot conceal failed forests.
  primary_metric: landscape_macro_rmse_m
  # A forest gain is never promoted if urban RMSE regresses by over 25 cm.
  max_urban_rmse_regression_m: 0.25
  # Building-only RMSE has its own guard so easy background cannot hide damage.
  max_building_rmse_regression_m: 0.25
