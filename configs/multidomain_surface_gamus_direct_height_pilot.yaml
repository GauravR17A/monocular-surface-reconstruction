experiment:
  name: multidomain_surface_gamus_direct_height_pilot
  seed: 20260913
  output_root: experiments

data:
  dataset: gamus
  root: D:/MSRData/GAMUS
  relative_prior_root: D:/MSRData/GAMUS_relative_priors
  require_relative_priors: true
  approved_index_path: D:/MSRData/GAMUS_quality_contract_v1_1/approved_samples.json
  approved_index_file_sha256: 5320d2e97be357b1e1725d7f2d9640493522ae3d13f1a051b63de55b530c05aa
  require_approved_index: true
  require_complete_official_splits: true
  patch_size: 384
  validation_patch_size: 1024
  num_workers: 4
  rgb_scale: 255.0
  train_radiometric_policy: raw
  validation_radiometric_policy: raw
  height_max_m: 200.0

model:
  base_checkpoint: experiments/20260826T192229Z_highbuild_full_convnext_tiny/checkpoint_best_rmse.pt
  initial_checkpoint: experiments/20260829T203146Z_multidomain_surface_v2_guarded_vegetation/checkpoint_best_guarded_vegetation.pt
  hidden_channels: 64
  maximum_building_residual_m: 30.0
  initial_canopy_height_m: 12.0
  initial_refinement_strength: 0.05
  fusion_mode: legacy
  building_protection_power: 2.5
  vegetation_fusion_temperature: 0.8
  vegetation_expert_fusion_threshold: 1.0
  vegetation_expert_fusion_strength: 0.0

training:
  epochs: 6
  batch_size: 2
  gradient_accumulation: 4
  drop_last: false
  freeze_base_epochs: 0
  parameter_groups:
    - name: final_encoder_stage
      prefixes:
        - base_model.encoder.stages_3.
      learning_rate: 0.000005
    - name: metric_decoder
      prefixes:
        - base_model.deepest.
        - base_model.decoder_stages.
        - base_model.height_head.
      learning_rate: 0.00003
    - name: surface_adapter
      prefixes:
        - adapter.
        - domain_head.
        - building_residual_head.
        - canopy_height_head.
        - refinement_strength_head.
      learning_rate: 0.0001
  learning_rate_schedule: warmup_cosine_steps
  warmup_optimizer_steps: 150
  minimum_learning_rate_factor: 0.1
  weight_decay: 0.01
  max_gradient_norm: 1.0
  precision: bf16
  early_stopping_patience: 2
  early_stopping_min_epochs: 3
  huber_delta_m: 2.0
  height_weight: 1.0
  semantic_weight: 0.2
  semantic_class_weights: [1.0, 1.5, 0.75]
  building_weight: 0.1
  building_mse_weight: 0.0
  tall_building_weight: 0.0
  tall_building_threshold_m: 20.0
  canopy_weight: 0.1
  canopy_mse_weight: 0.0
  tall_canopy_weight: 0.0
  tall_canopy_threshold_m: 15.0
  fused_building_weight: 0.25
  fused_building_mse_weight: 0.0
  fused_vegetation_weight: 0.25
  fused_tall_building_weight: 0.1
  fused_tall_vegetation_weight: 0.1
  building_distillation_weight: 0.0
  ground_suppression_weight: 0.0
  refinement_weight: 0.0
  uncertainty_weight: 0.0

evaluation:
  promotion_eligible: false
  promotion_blockers:
    - corrected legacy validation must pass after training
    - a newly locked geographic holdout is required
  recompute_initial_metrics_on_current_validation: true
  initial_model_overrides:
    fusion_mode: protected_vegetation
    building_protection_power: 2.5
    vegetation_fusion_temperature: 0.8
    vegetation_expert_fusion_threshold: 0.85
    vegetation_expert_fusion_strength: 0.10
  primary_selection:
    suite: gamus
    metric: rmse_m
    mode: min
  validation_guards:
    gamus:
      rmse_m:
        min_improvement: 0.20
        baseline: initial
      mae_m:
        min_improvement: 0.10
        baseline: initial
      correlation:
        max_drop: 0.01
        baseline: initial
      r2:
        max_drop: 0.02
        baseline: initial
      region_macro_rmse_m:
        min_improvement: 0.20
        baseline: initial
      object_domain_macro_rmse_m:
        min_improvement: 0.20
        baseline: initial
      regions.GAMUS_DC.rmse_m:
        max_regression: 0.10
        baseline: initial
      regions.GAMUS_PHL.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.ground.rmse_m:
        max_regression: 0.05
        baseline: initial
      domains.building.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.vegetation.rmse_m:
        max_regression: 0.10
        baseline: initial
      tall_objects.building.rmse_m:
        max_regression: 0.20
        baseline: initial
      tall_objects.vegetation.rmse_m:
        max_regression: 0.20
        baseline: initial
      semantic_identification.macro_f1:
        max_drop: 0.02
        baseline: initial
      semantic_identification.per_class.ground.f1:
        max_drop: 0.03
        baseline: initial
      semantic_identification.per_class.building.f1:
        max_drop: 0.03
        baseline: initial
      semantic_identification.per_class.vegetation.f1:
        max_drop: 0.03
        baseline: initial
  max_urban_rmse_regression_m: 0.15
  max_building_rmse_regression_m: 0.15
  max_initial_overall_rmse_regression_m: 0.0
  max_initial_ground_rmse_regression_m: 0.05
  max_initial_building_rmse_regression_m: 0.10
  max_initial_vegetation_rmse_regression_m: 0.10
