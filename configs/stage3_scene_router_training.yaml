router_training:
  records: outputs/stage3_scene_router_records/records.jsonl
  record_provenance: outputs/stage3_scene_router_records/provenance.json
  record_completion: outputs/stage3_scene_router_records/completion.json
  output_dir: experiments/stage3_scene_router_guarded

  epochs: 30
  batch_size: 64
  hidden_features: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  minimum_candidate_gain: 0.02
  fallback_weight: 4.0
  candidate_weight: 1.0
  brier_weight: 0.05

  # Candidate routing is authorized only under all three safety guards.
  minimum_threshold: 0.90
  minimum_precision: 0.98
  maximum_mean_utility_regression: 0.0
  minimum_candidate_selections: 1

  seed: 20260912
  device: cuda
