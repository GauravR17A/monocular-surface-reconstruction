experiment:
  name: multidomain_surface_gamus_stage2_mixed_replay
  seed: 20260912
  output_root: experiments

data:
  dataset: mixed_replay
  root: D:/MSRData/GAMUS
  relative_prior_root: D:/MSRData/GAMUS_relative_priors
  require_relative_priors: true
  require_complete_official_splits: true
  train_manifest: data/multidomain_v2/manifests_with_priors/train.csv
  val_manifest: data/multidomain_v2/manifests_with_priors/validation.csv
  test_manifest: data/multidomain_v2/manifests_with_priors/test.csv
  patch_size: 384
  validation_patch_size: 384
  train_samples_per_epoch: 6672
  gamus_train_fraction: 0.75
  balanced_legacy_landscape_sampling: true
  num_workers: 4
  rgb_scale: 255.0
  height_max_m: 200.0
  building_threshold_m: 2.0
  gamus_train_radiometric_policy: raw
  legacy_train_radiometric_policy: raw
  validation_radiometric_policy: raw

model:
  base_checkpoint: experiments/20260826T192229Z_highbuild_full_convnext_tiny/checkpoint_best_rmse.pt
  initial_checkpoint: experiments/20260912T153331Z_multidomain_surface_gamus_stage1_heads/checkpoint_best_landscape.pt
  hidden_channels: 64
  maximum_building_residual_m: 30.0
  initial_canopy_height_m: 12.0
  initial_refinement_strength: 0.05
  fusion_mode: protected_vegetation
  building_protection_power: 2.5
  vegetation_fusion_temperature: 0.8
  vegetation_expert_fusion_threshold: 0.85
  vegetation_expert_fusion_strength: 0.10

training:
  epochs: 6
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.00001
  base_learning_rate_multiplier: 0.0
  freeze_base_epochs: 6
  trainable_adapter_prefixes:
    - domain_head.
  weight_decay: 0.0
  max_gradient_norm: 1.0
  precision: bf16
  early_stopping_patience: 6
  huber_delta_m: 2.0
  semantic_weight: 1.0
  gamus_semantic_weight: 0.75
  legacy_semantic_weight: 0.25
  gamus_class_weights: [1.0, 1.5, 0.75]
  legacy_class_weights: [1.0, 1.0, 1.0]
  legacy_urban_ground_pixel_weight: 0.35
  distillation_temperature: 2.0
  gamus_distillation_weight: 0.20
  legacy_fused_height_weight: 0.025
  height_weight: 0.0
  building_weight: 0.0
  building_mse_weight: 0.0
  tall_building_weight: 0.0
  canopy_weight: 0.0
  canopy_mse_weight: 0.0
  tall_canopy_weight: 0.0
  fused_building_weight: 0.0
  fused_building_mse_weight: 0.0
  building_distillation_weight: 0.0
  ground_suppression_weight: 0.0
  refinement_weight: 0.0
  uncertainty_weight: 0.0

evaluation:
  recompute_initial_metrics_on_current_validation: true
  primary_selection:
    suite: legacy
    metric: semantic_identification.macro_f1
    mode: max
  max_urban_rmse_regression_m: 0.15
  max_building_rmse_regression_m: 0.15
  max_initial_overall_rmse_regression_m: 0.02
  max_initial_mixed_rmse_regression_m: 0.02
  max_initial_ground_rmse_regression_m: 0.03
  max_initial_building_rmse_regression_m: 0.03
  max_initial_vegetation_rmse_regression_m: 0.03
  validation_guards:
    gamus:
      semantic_identification.macro_f1:
        min: 0.740
      semantic_identification.per_class.vegetation.f1:
        min: 0.724
      semantic_identification.per_class.building.f1:
        min: 0.814
      semantic_identification.per_class.ground.f1:
        min: 0.677
      semantic_identification.accuracy:
        min: 0.724
      building_router.f0_5:
        max_drop: 0.01
        baseline: initial
      rmse_m:
        max_regression: 0.02
        baseline: initial
      domains.ground.rmse_m:
        max_regression: 0.03
        baseline: initial
      domains.building.rmse_m:
        max_regression: 0.03
        baseline: initial
      domains.vegetation.rmse_m:
        max_regression: 0.03
        baseline: initial
    legacy:
      semantic_identification.macro_f1:
        min: 0.622
      semantic_identification.per_class.ground.f1:
        min: 0.704
      semantic_identification.per_class.building.f1:
        min: 0.518
      semantic_identification.per_class.vegetation.f1:
        min: 0.614
      building_router.f0_5:
        max_drop: 0.01
        baseline: initial
      rmse_m:
        max_regression: 0.02
        baseline: initial
      landscapes.urban.rmse_m:
        max_regression: 0.02
        baseline: initial
      landscapes.forest.rmse_m:
        max_regression: 0.02
        baseline: initial
      domains.vegetation.rmse_m:
        max: 8.2881
