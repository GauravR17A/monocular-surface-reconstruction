six_class:
  class_names:
    - ground
    - buildings
    - water
    - roads
    - low_vegetation
    - trees
  required_per_class_metrics:
    - precision
    - recall
    - iou
    - f1
  require_positive_support: true
  road_boundary_tolerance_pixels: 2
  water_dark_diagnostic_is_proxy_only: true

# Candidate-versus-protected gates match the frozen direct-height pilot.
protected_height_gates:
  rmse_m: {direction: min_improvement, limit: 0.20}
  mae_m: {direction: min_improvement, limit: 0.10}
  correlation: {direction: max_drop, limit: 0.01}
  r2: {direction: max_drop, limit: 0.02}
  region_macro_rmse_m: {direction: min_improvement, limit: 0.20}
  object_domain_macro_rmse_m: {direction: min_improvement, limit: 0.20}
  regions.GAMUS_DC.rmse_m: {direction: max_regression, limit: 0.10}
  regions.GAMUS_PHL.rmse_m: {direction: max_regression, limit: 0.10}
  domains.ground.rmse_m: {direction: max_regression, limit: 0.05}
  domains.building.rmse_m: {direction: max_regression, limit: 0.10}
  domains.vegetation.rmse_m: {direction: max_regression, limit: 0.10}
  tall_objects.building.rmse_m: {direction: max_regression, limit: 0.20}
  tall_objects.vegetation.rmse_m: {direction: max_regression, limit: 0.20}

# The expanded model must also preserve the stronger result found by the
# height-only pilot. These are no-regression caps, not post-hoc targets.
height_pilot_protection_gates:
  rmse_m: {direction: max_regression, limit: 0.10}
  mae_m: {direction: max_regression, limit: 0.10}
  correlation: {direction: max_drop, limit: 0.01}
  r2: {direction: max_drop, limit: 0.02}
  region_macro_rmse_m: {direction: max_regression, limit: 0.10}
  object_domain_macro_rmse_m: {direction: max_regression, limit: 0.10}
  regions.GAMUS_DC.rmse_m: {direction: max_regression, limit: 0.10}
  regions.GAMUS_PHL.rmse_m: {direction: max_regression, limit: 0.10}
  domains.ground.rmse_m: {direction: max_regression, limit: 0.05}
  domains.building.rmse_m: {direction: max_regression, limit: 0.10}
  domains.vegetation.rmse_m: {direction: max_regression, limit: 0.10}
  tall_objects.building.rmse_m: {direction: max_regression, limit: 0.20}
  tall_objects.vegetation.rmse_m: {direction: max_regression, limit: 0.20}

