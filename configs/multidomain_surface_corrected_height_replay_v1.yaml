experiment:
  name: multidomain_surface_corrected_height_replay_v1
  seed: 20260915
  output_root: experiments

contracts:
  purpose: corrected_multi_source_height_replay
  official_test_used: false
  depth_anything_prior_policy: fixed_cached_stored_01
  gamus_height_unit_status: metre_assumed_not_publisher_verified
  gamus_regression_source_class_ids: [1, 2, 3, 6]
  gamus_excluded_regression_source_class_ids: [0, 4, 5]
  highbuild_height_support: measured_coco_intersection_only
  open_canopy_height_unit: verified_metres
  missing_height_policy: ignored_never_zero

data:
  dataset: mixed_replay
  root: D:/MSRData/GAMUS
  relative_prior_root: D:/MSRData/GAMUS_relative_priors
  require_relative_priors: true
  approved_index_path: D:/MSRData/GAMUS_quality_contract_v1_1/approved_samples.json
  approved_index_file_sha256: 5320d2e97be357b1e1725d7f2d9640493522ae3d13f1a051b63de55b530c05aa
  require_approved_index: true
  require_complete_official_splits: true
  train_manifest: D:/MSRData/data/multidomain_v2/highbuild_measured_coco_intersection_v1/manifests/train.csv
  train_manifest_file_sha256: 8f7f85997df53c2dae82d571c52db4ca8f10d4cb5638784e729b38632a1067e4
  val_manifest: D:/MSRData/data/multidomain_v2/highbuild_measured_coco_intersection_v1/manifests/validation.csv
  val_manifest_file_sha256: 2e21024fb7d7562e51d91e219c9434087fadfee58b107a4eacdc2c04cd8fa118
  highbuild_contract_report: D:/MSRData/data/multidomain_v2/highbuild_measured_coco_intersection_v1/contract_report.json
  highbuild_contract_report_sha256: b919b02d50bbf5de4e7e69ff96c3887bbd0f5ab0f56fa0c6f7612b20c51e91e3
  patch_size: 384
  validation_patch_size: 384
  train_samples_per_epoch: 6000
  gamus_train_fraction: 0.50
  balanced_legacy_landscape_sampling: true
  # Every sparse HighBuild crop contains genuine measured-height support;
  # OpenCanopy remains a normal random full-surface crop.
  legacy_supervised_crop_probability: 1.0
  legacy_relative_prior_policy: stored_01
  num_workers: 4
  rgb_scale: 255.0
  height_max_m: 200.0
  building_threshold_m: 2.0
  gamus_train_radiometric_policy: raw
  legacy_train_radiometric_policy: raw
  validation_radiometric_policy: raw

model:
  base_checkpoint: experiments/20260826T192229Z_highbuild_full_convnext_tiny/checkpoint_best_rmse.pt
  initial_checkpoint: experiments/20260829T203146Z_multidomain_surface_v2_guarded_vegetation/checkpoint_best_guarded_vegetation.pt
  hidden_channels: 64
  maximum_building_residual_m: 30.0
  initial_canopy_height_m: 12.0
  initial_refinement_strength: 0.05
  fusion_mode: protected_vegetation
  building_protection_power: 2.5
  vegetation_fusion_temperature: 0.8
  vegetation_expert_fusion_threshold: 0.85
  vegetation_expert_fusion_strength: 0.10

training:
  mixed_replay_objective: height_supervision
  epochs: 4
  batch_size: 4
  gradient_accumulation: 2
  freeze_base_epochs: 0
  parameter_groups:
    - name: metric_height_output
      prefixes:
        - base_model.height_head.
      learning_rate: 0.000005
      weight_decay: 0.0
    - name: vegetation_height_and_safe_fusion
      prefixes:
        - canopy_height_head.
        - refinement_strength_head.
      learning_rate: 0.00003
      weight_decay: 0.0
  learning_rate_schedule: warmup_cosine_steps
  warmup_optimizer_steps: 100
  minimum_learning_rate_factor: 0.1
  weight_decay: 0.0
  max_gradient_norm: 1.0
  precision: bf16
  early_stopping_patience: 2
  early_stopping_min_epochs: 3
  huber_delta_m: 2.0
  height_weight: 1.0
  semantic_weight: 0.10
  semantic_class_weights: [0.4, 1.0, 0.8]
  building_weight: 0.60
  building_mse_weight: 0.0
  tall_building_weight: 0.15
  tall_building_threshold_m: 20.0
  canopy_weight: 0.85
  canopy_mse_weight: 0.0
  tall_canopy_weight: 0.15
  tall_canopy_threshold_m: 15.0
  fused_building_weight: 0.70
  fused_building_mse_weight: 0.0
  fused_vegetation_weight: 0.80
  fused_tall_building_weight: 0.15
  fused_tall_vegetation_weight: 0.15
  building_distillation_weight: 0.0
  ground_suppression_weight: 0.50
  refinement_weight: 0.01
  uncertainty_weight: 0.0

evaluation:
  promotion_eligible: false
  promotion_blockers:
    - all same-protocol GAMUS and corrected legacy guards must pass
    - corrected full-scene HighBuild and OpenCanopy scorecard must pass
    - preregistered Bay of Plenty external metric-height holdout must pass
    - explicit human review is required before changing the app pointer
  recompute_initial_metrics_on_current_validation: true
  primary_selection:
    suite: legacy
    metric: object_domain_macro_rmse_m
    mode: min
  validation_guards:
    gamus:
      rmse_m:
        min_improvement: 0.10
        baseline: initial
      mae_m:
        min_improvement: 0.05
        baseline: initial
      correlation:
        max_drop: 0.005
        baseline: initial
      r2:
        max_drop: 0.01
        baseline: initial
      regions.GAMUS_DC.rmse_m:
        max_regression: 0.10
        baseline: initial
      regions.GAMUS_PHL.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.ground.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.building.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.vegetation.rmse_m:
        max_regression: 0.10
        baseline: initial
      semantic_identification.macro_f1:
        max_drop: 0.001
        baseline: initial
      semantic_identification.per_class.building.f1:
        max_drop: 0.001
        baseline: initial
      semantic_identification.per_class.vegetation.f1:
        max_drop: 0.001
        baseline: initial
    legacy:
      rmse_m:
        min_improvement: 0.10
        baseline: initial
      mae_m:
        min_improvement: 0.05
        baseline: initial
      correlation:
        max_drop: 0.005
        baseline: initial
      r2:
        max_drop: 0.01
        baseline: initial
      landscapes.urban.rmse_m:
        max_regression: 0.10
        baseline: initial
      landscapes.forest.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.building.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.vegetation.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.ground.rmse_m:
        max_regression: 0.10
        baseline: initial
      semantic_identification.macro_f1:
        max_drop: 0.001
        baseline: initial
  max_urban_rmse_regression_m: 0.15
  max_building_rmse_regression_m: 0.15
  max_initial_overall_rmse_regression_m: 0.10
  max_initial_mixed_rmse_regression_m: 0.10
  max_initial_ground_rmse_regression_m: 0.10
  max_initial_building_rmse_regression_m: 0.10
  max_initial_vegetation_rmse_regression_m: 0.10
