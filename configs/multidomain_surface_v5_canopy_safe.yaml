experiment:
  name: multidomain_surface_v5_canopy_safe
  seed: 20260912
  output_root: experiments

data:
  train_manifest: data/multidomain_v2/manifests_with_priors/train.csv
  val_manifest: data/multidomain_v2/manifests_with_priors/validation.csv
  test_manifest: data/multidomain_v2/manifests_with_priors/test.csv
  training_landscapes: [forest]
  patch_size: 384
  validation_patch_size: 384
  train_samples_per_epoch: 4096
  balanced_landscape_sampling: false
  num_workers: 4
  rgb_scale: 255.0
  train_radiometric_policy: random_sensor
  validation_radiometric_policy: raw
  height_max_m: 200.0
  building_threshold_m: 2.0

model:
  base_checkpoint: experiments/20260826T192229Z_highbuild_full_convnext_tiny/checkpoint_best_rmse.pt
  initial_checkpoint: experiments/20260829T203146Z_multidomain_surface_v2_guarded_vegetation/checkpoint_best_guarded_vegetation.pt
  hidden_channels: 64
  maximum_building_residual_m: 30.0
  initial_canopy_height_m: 12.0
  initial_refinement_strength: 0.05
  fusion_mode: protected_vegetation
  building_protection_power: 2.5
  vegetation_fusion_temperature: 0.8
  vegetation_expert_fusion_threshold: 0.85
  vegetation_expert_fusion_strength: 0.10

training:
  epochs: 12
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.00002
  base_learning_rate_multiplier: 0.0
  freeze_base_epochs: 12
  trainable_adapter_prefixes:
    - canopy_height_head.
  weight_decay: 0.01
  max_gradient_norm: 1.0
  precision: bf16
  early_stopping_patience: 3
  huber_delta_m: 2.0
  height_weight: 0.0
  semantic_weight: 0.0
  building_weight: 0.0
  building_mse_weight: 0.0
  tall_building_weight: 0.0
  fused_building_weight: 0.0
  fused_building_mse_weight: 0.0
  building_distillation_weight: 0.0
  canopy_weight: 1.0
  canopy_mse_weight: 0.03
  tall_canopy_weight: 0.35
  tall_canopy_threshold_m: 15.0
  ground_suppression_weight: 0.0
  refinement_weight: 0.0
  uncertainty_weight: 0.0

evaluation:
  primary_metric: canopy_expert_rmse_m
  initial_selection_value_m: 7.080806
  max_urban_rmse_regression_m: 0.15
  max_building_rmse_regression_m: 0.15
  max_initial_overall_rmse_regression_m: 0.02
  max_initial_urban_rmse_regression_m: 0.02
  max_initial_forest_rmse_regression_m: 0.00
  max_initial_ground_rmse_regression_m: 0.02
  max_initial_building_rmse_regression_m: 0.01
  max_initial_vegetation_rmse_regression_m: 0.00
  initial_building_expert_rmse_m: 7.202151687001978
  max_initial_building_expert_rmse_regression_m: 0.001
