experiment:
  name: multidomain_surface_gamus_height_safe_v2
  seed: 20260915
  output_root: experiments

# The publisher describes GAMUS as AGL/nDSM supervision and its reference
# loader applies no scaling, but the local HDF5 files do not declare units.
# This short development pilot therefore records raw x1.0 as an explicit
# assumption. It is never promotion-eligible without external metric evidence.
contracts:
  height_unit_status: metre_assumed
  raw_height_scale: 1.0
  official_test_used: false
  depth_anything_prior_policy: fixed_cached_stored_01
  regression_source_class_ids: [1, 2, 3, 6]
  excluded_regression_source_class_ids: [0, 4, 5]

data:
  dataset: gamus
  root: D:/MSRData/GAMUS
  relative_prior_root: D:/MSRData/GAMUS_relative_priors
  require_relative_priors: true
  approved_index_path: D:/MSRData/GAMUS_quality_contract_v1_1/approved_samples.json
  approved_index_file_sha256: 5320d2e97be357b1e1725d7f2d9640493522ae3d13f1a051b63de55b530c05aa
  require_approved_index: true
  require_complete_official_splits: true
  patch_size: 384
  validation_patch_size: 1024
  num_workers: 4
  rgb_scale: 255.0
  train_radiometric_policy: raw
  validation_radiometric_policy: raw
  height_max_m: 200.0

model:
  base_checkpoint: experiments/20260826T192229Z_highbuild_full_convnext_tiny/checkpoint_best_rmse.pt
  initial_checkpoint: experiments/20260829T203146Z_multidomain_surface_v2_guarded_vegetation/checkpoint_best_guarded_vegetation.pt
  hidden_channels: 64
  maximum_building_residual_m: 30.0
  initial_canopy_height_m: 12.0
  initial_refinement_strength: 0.05
  fusion_mode: protected_vegetation
  building_protection_power: 2.5
  vegetation_fusion_temperature: 0.8
  vegetation_expert_fusion_threshold: 0.85
  vegetation_expert_fusion_strength: 0.10

training:
  epochs: 4
  batch_size: 2
  gradient_accumulation: 4
  drop_last: false
  freeze_base_epochs: 0
  # Only 98 scalar parameters are allowed to learn. The DAV2 maps, encoder,
  # decoder, building detector, semantic adapter/router, fusion-strength gate,
  # and all production tensors outside these two heads remain frozen.
  parameter_groups:
    - name: metric_height_output
      prefixes:
        - base_model.height_head.
      learning_rate: 0.000002
      weight_decay: 0.0
    - name: canopy_metric_output
      prefixes:
        - canopy_height_head.
      learning_rate: 0.00003
      weight_decay: 0.0
  learning_rate_schedule: warmup_cosine_steps
  warmup_optimizer_steps: 100
  minimum_learning_rate_factor: 0.1
  weight_decay: 0.0
  max_gradient_norm: 1.0
  precision: bf16
  early_stopping_patience: 2
  early_stopping_min_epochs: 3
  huber_delta_m: 2.0
  height_weight: 1.0
  # The frozen semantic path supplies only a weak preservation gradient to the
  # tiny height output head; no classifier tensor is trainable in this run.
  semantic_weight: 0.10
  semantic_class_weights: [0.4, 1.0, 0.8]
  building_weight: 0.40
  building_mse_weight: 0.0
  tall_building_weight: 0.10
  tall_building_threshold_m: 20.0
  canopy_weight: 0.70
  canopy_mse_weight: 0.0
  tall_canopy_weight: 0.10
  tall_canopy_threshold_m: 15.0
  fused_building_weight: 0.50
  fused_building_mse_weight: 0.0
  fused_vegetation_weight: 0.50
  fused_tall_building_weight: 0.10
  fused_tall_vegetation_weight: 0.10
  building_distillation_weight: 0.0
  ground_suppression_weight: 0.50
  refinement_weight: 0.0
  uncertainty_weight: 0.0

evaluation:
  promotion_eligible: false
  promotion_blockers:
    - corrected HighBuild/OpenCanopy development guards must pass after training
    - a genuinely new locked geographic holdout is required
    - GAMUS metric units require independent external confirmation
  recompute_initial_metrics_on_current_validation: true
  primary_selection:
    suite: gamus
    metric: rmse_m
    mode: min
  validation_guards:
    gamus:
      rmse_m:
        min_improvement: 0.20
        baseline: initial
      mae_m:
        min_improvement: 0.10
        baseline: initial
      correlation:
        max_drop: 0.01
        baseline: initial
      r2:
        max_drop: 0.02
        baseline: initial
      region_macro_rmse_m:
        min_improvement: 0.20
        baseline: initial
      object_domain_macro_rmse_m:
        min_improvement: 0.20
        baseline: initial
      regions.GAMUS_DC.rmse_m:
        max_regression: 0.10
        baseline: initial
      regions.GAMUS_PHL.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.ground.rmse_m:
        max_regression: 0.05
        baseline: initial
      domains.building.rmse_m:
        max_regression: 0.10
        baseline: initial
      domains.vegetation.rmse_m:
        max_regression: 0.10
        baseline: initial
      tall_objects.building.rmse_m:
        max_regression: 0.20
        baseline: initial
      tall_objects.vegetation.rmse_m:
        max_regression: 0.20
        baseline: initial
      semantic_identification.macro_f1:
        max_drop: 0.02
        baseline: initial
      semantic_identification.per_class.ground.f1:
        max_drop: 0.03
        baseline: initial
      semantic_identification.per_class.building.f1:
        max_drop: 0.03
        baseline: initial
      semantic_identification.per_class.vegetation.f1:
        max_drop: 0.03
        baseline: initial
  max_urban_rmse_regression_m: 0.15
  max_building_rmse_regression_m: 0.15
  max_initial_overall_rmse_regression_m: 0.0
  max_initial_ground_rmse_regression_m: 0.05
  max_initial_building_rmse_regression_m: 0.10
  max_initial_vegetation_rmse_regression_m: 0.10
